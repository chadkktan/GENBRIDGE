
<div class="card">
    <div class="edit-actions">
        <button
            id="cancelBtn"
            class="btn btn-outline"
            type="button"
            onclick="cancelEdit()"
            style="display: none;"
        >
            Cancel
        </button>

        <button
            id="editBtn"
            class="btn btn-red"
            type="button"
            onclick="onEditButtonClick()"
        >
            Edit Profile
        </button>
    </div>

    <h2>Personal Information</h2>

    <form
        id="profileForm"
        method="POST"
        action="/update-profile"
        enctype="multipart/form-data"
    >
        <div class="grid">
            <div>
                <label for="firstName">First Name</label>
                <input id="firstName" name="first_name" value="{{ profile.first_name|default('') }}" readonly class="editable-field" />
                <div class="error-text" id="errFirstName">Please enter your first name.</div>
            </div>

            <div>
                <label for="lastName">Last Name</label>
                <input id="lastName" name="last_name" value="{{ profile.last_name|default('') }}" readonly class="editable-field" />
                <div class="error-text" id="errLastName">Please enter your last name.</div>
            </div>

            <!-- Email is intentionally NOT editable (backend also forces auth email) -->
            <div>
                <label for="email">Email Address</label>
                <input
                    id="email"
                    name="email"
                    value="{{ profile.email|default('') }}"
                    placeholder="example@gmail.com"
                    readonly
                    style="background:#f2f2f2; cursor:not-allowed;"
                />
            </div>

            <div>
                <label for="phone">Phone Number</label>
                <input id="phone" name="phone" value="{{ profile.phone|default('') }}" readonly class="editable-field" />
                <div class="error-text" id="errPhone">Please enter a valid phone number.</div>
            </div>

            <div>
                <label for="location">Location</label>
                <input id="location" name="location" value="{{ profile.location|default('') }}" readonly class="editable-field" />
            </div>

            <div>
                <label for="website">Website</label>
                <input id="website" name="website" value="{{ profile.website|default('-') }}" readonly class="editable-field" />
            </div>

            <div class="bio-wide">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" readonly class="editable-field">{{ profile.bio|default('') }}</textarea>
            </div>
        </div>
    </form>
</div>
