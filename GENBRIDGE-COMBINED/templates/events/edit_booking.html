{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='event_common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='event.css') }}">
{% endblock %}
{% block content %}

<div class="genbridge-page-gray">
  <div class="container py-4">

    <a href="{{ url_for('bookings') }}" class="genbridge-back-link">← Back</a>

    <div class="genbridge-form-wrap mt-3">
      <div class="genbridge-form-card">
        <h5 class="fw-bold mb-3">Edit Registration</h5>

        <form method="post" action="{{ url_for('edit_booking_post', booking_id=booking.booking_id) }}">


        <div class="row g-3 mb-3">
  <div class="col-md-6">
    <label class="form-label genbridge-label">First Name</label>
    <input class="form-control genbridge-input" name="first_name" value="{{ booking.first_name }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label genbridge-label">Last Name</label>
    <input class="form-control genbridge-input" name="last_name" value="{{ booking.last_name }}" required>
  </div>
</div>


          <div class="mb-3">
            <label class="form-label genbridge-label">Contact</label>
            <input class="form-control genbridge-input" name="contact" value="{{ booking.contact }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label genbridge-label">Age Group</label>
            <select class="form-select genbridge-input" name="age_group" required>
              <option {% if booking.age_group == "Youth (13-25)" %}selected{% endif %}>Youth (13-25)</option>
              <option {% if booking.age_group == "Adult (26-59)" %}selected{% endif %}>Adult (26-59)</option>
              <option {% if booking.age_group == "Senior (60+)" %}selected{% endif %}>Senior (60+)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label genbridge-label">Registering For</label>
            <select class="form-select genbridge-input" name="reg_type" required>
              <option {% if booking.reg_type == "Registering for myself" %}selected{% endif %}>Registering for myself</option>
              <option {% if booking.reg_type == "Registering on behalf of someone else" %}selected{% endif %}>Registering on behalf of someone else</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button class="btn genbridge-primary-btn flex-grow-1" type="submit">Save Changes</button>
            <a class="btn btn-outline-secondary genbridge-outline-btn" href="{{ url_for('bookings') }}">Cancel</a>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>

{% endblock %}
