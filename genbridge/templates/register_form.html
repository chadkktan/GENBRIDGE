{% extends "base.html" %}
{% block content %}

<div class="genbridge-page-gray">
  <div class="container py-4">

    <a href="{{ url_for('event_details', event_id=event.id) }}" class="genbridge-back-link">← Back</a>

    <div class="genbridge-form-wrap mt-3">
      <div class="genbridge-form-header">
        <div class="small text-muted">Registering for</div>
        <div class="fw-bold">{{ event.title }}</div>
        <div class="small text-muted">{{ event.date_long }} • {{ event.time_only }}</div>
      </div>

      <div class="genbridge-form-card">
        <div class="small text-muted mb-3">Registration Form</div>

        <form method="post" action="{{ url_for('register_submit', event_id=event.id) }}">
          <div class="row g-3">
  <div class="col-md-6">
    <label class="form-label genbridge-label">First Name *</label>
    <input class="form-control genbridge-input" name="first_name" required>
  </div>

  <div class="col-md-6">
    <label class="form-label genbridge-label">Last Name *</label>
    <input class="form-control genbridge-input" name="last_name" required>
  </div>
</div>


          <div class="mb-3">
           <label class="form-label genbridge-label">Contact Number *</label>
<input class="form-control genbridge-input"
       name="contact"
       required
       inputmode="numeric"
       pattern="\d{8,}"
       minlength="8"
       placeholder="e.g. 91234567">
<small class="text-muted">Minimum 8 digits.</small>

          </div>

          <div class="mb-3">
            <label class="form-label genbridge-label">Age Group *</label>
            <select class="form-select genbridge-input" name="age_group" required>
              <option value="" selected disabled>Select your age group</option>
              <option>Youth (13-25)</option>
              <option>Adult (26-59)</option>
              <option>Senior (60+)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label genbridge-label">Who are you registering for? *</label>
            <div class="d-flex flex-column gap-2">
              <label class="genbridge-radio">
                <input type="radio" name="reg_type" value="Registering for myself" required>
                Registering for myself
              </label>
              <label class="genbridge-radio">
                <input type="radio" name="reg_type" value="Registering on behalf of someone else" required>
                Registering on behalf of someone else
              </label>
            </div>
          </div>

          <div class="genbridge-consent-box mb-4">
            <label class="genbridge-checkbox">
              <input type="checkbox" name="consent" value="yes" required>
              I agree to terms and consent to the collection/use of my personal data for registration purposes.
            </label>
          </div>

          <div class="d-flex gap-2">
            <button class="btn genbridge-primary-btn flex-grow-1" type="submit">Confirm Registration</button>
            <a class="btn btn-outline-secondary genbridge-outline-btn" href="{{ url_for('event_details', event_id=event.id) }}">Cancel</a>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
