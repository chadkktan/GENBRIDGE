<div class="profile-header">

    <a class="back-btn" href="{{ url_for('home') }}" aria-label="Back to home">
        &#x2039;
    </a>

    <div class="profile-header-inner">
        <div class="profile-left">
            <div class="avatar-wrapper">
                <img
                    id="profileImage"
                    class="avatar"
                    alt="Profile picture"
                    src="{% if profile.avatar_filename %}
                            {{ url_for('static', filename='uploads/' + profile.avatar_filename) }}
                         {% else %}
                            https://www.gravatar.com/avatar/?d=mp&s=200
                         {% endif %}"
                />

                <label for="avatarInput" class="avatar-upload" title="Change profile photo">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path d="M3 7h4l2-2h6l2 2h4v12H3V7z" fill="none" stroke="white" stroke-width="2"></path>
                        <circle cx="12" cy="13" r="3.2" fill="none" stroke="white" stroke-width="2"></circle>
                    </svg>
                </label>

                <!-- form="profileForm" ensures it submits with the profile form -->
                <input
                    id="avatarInput"
                    name="avatar"
                    type="file"
                    accept="image/*"
                    form="profileForm"
                />
            </div>

            <div>
                <h1 id="headerName">{{ profile.first_name|default('') }} {{ profile.last_name|default('') }}</h1>
                <p id="headerEmail">{{ profile.email|default('') }}</p>

                <span class="badge {% if profile.role == 'Senior' %}black{% else %}red{% endif %}">
                    {% if profile.role == "Senior" %}Senior Member{% else %}Youth Member{% endif %}
                </span>

                <span class="badge verified">Verified</span>
            </div>
        </div>
    </div>
</div>
