<section id="step3" style="display:none;">
    <h1>Almost done!</h1>
    <p class="subtitle">
        Tell others a bit about yourself and what you're hoping to get from Genbridge
    </p>

    <div style="margin-top:12px;">
        <label>Your Bio</label>

        <textarea
            class="bio"
            id="bio"
            name="bio"
            maxlength="500"
            placeholder="Share your story, what you're passionate about, and what you hope to learn or share through intergenerational connections..."
        >{{ profile.bio|default('') }}</textarea>

        <div class="char-count">
            <span id="bioCount">0</span>/500 characters
        </div>
    </div>

    <div class="summary">
        <div class="summary-title">Profile Summary</div>

        <div class="summary-row">👤 <span id="sumName">-</span></div>
        <div class="summary-row">📍 <span id="sumLocation">-</span></div>
        <div class="summary-row">🧑‍🤝‍🧑 <span id="sumRole">-</span></div>

        <div style="margin-top:10px; font-weight:900; font-size:12px; color:#333;">
            Interests:
        </div>

        <div class="pill-row" id="sumInterests"></div>
    </div>

    <div class="divider"></div>

    <div class="actions">
        <button class="btn btn-outline" type="button" onclick="prevStep()">Back</button>
        <button class="btn btn-next" type="submit">Complete Profile →</button>
    </div>
</section>
