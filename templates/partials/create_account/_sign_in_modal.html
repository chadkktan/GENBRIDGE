{# - Shows flashed signin_errors (already collected in create_account.html)
   - Open/close is handled by create_account.js #}

<div class="gb-modal-overlay" id="signInModal" aria-hidden="true">
    <div class="gb-modal" role="dialog" aria-modal="true" aria-labelledby="signInTitle">
        <div class="gb-modal-head">
            <h3 class="gb-modal-title" id="signInTitle">Sign in</h3>
            <button type="button" class="gb-modal-x" onclick="closeSignInModal()" aria-label="Close">×</button>
        </div>

        <p class="gb-modal-text">Enter your email and password to continue.</p>

        {% if signin_errors %}
            {% for m in signin_errors %}
                <div class="flash error" style="margin: 0 0 12px;">{{ m }}</div>
            {% endfor %}
        {% endif %}

        <form id="signInForm" action="{{ url_for('sign_in') }}" method="POST" novalidate>
            <div class="field">
                <label for="signInEmail">Email Address</label>
                <input
                    id="signInEmail"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                />
            </div>

            <div class="field">
                <label for="signInPassword">Password</label>
                <div class="pw-wrap">
                    <input
                        id="signInPassword"
                        name="password"
                        type="password"
                        placeholder="••••••••"
                        required
                    />
                    <button class="eye-btn" type="button" onclick="togglePassword('signInPassword')" aria-label="Show/Hide password">
                        👁
                    </button>
                </div>
            </div>

            <div class="gb-modal-actions">
                <button type="button" class="gb-btn gb-btn-cancel" onclick="closeSignInModal()">Cancel</button>
                <button type="submit" class="btn-primary" style="width:auto; padding:12px 16px;">Sign In</button>
            </div>
        </form>
    </div>
</div>
