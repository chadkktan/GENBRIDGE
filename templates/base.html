<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> {% block title %} {% endblock %} </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
        crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='navbar.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='stories.css') }}">
        <link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet'> <!--link monsterrat font-->
        <link rel="stylesheet" href="{{ url_for('static', filename='postView.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='postCreation.css') }}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> <!--icons such as post plus button-->
    </head>
    


    <body>
        {% block navbar %}
            {% include 'includes/_navbar.html' %}
        {% endblock %}

        <!--main body-->
        <div class="container-fluid" id ='main-content' style="min-height:100vh; background:#f8f9fa;"> 
            {% block content %}
            {% endblock %}
        </div>
        <!--endmainbody-->


        {% block scripts %}
            <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
            integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
            crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" 
            integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
            crossorigin="anonymous"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        {% endblock %}

        {% block footer %}
            {% include 'includes/_footer.html' %}
        {% endblock %}
    </body>
</html>
