{% extends 'base.html' %}

{% block title %}Create Community - GenBridge{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-5 fw-bold mb-4">Create New Community</h1>
            
            <div class="card shadow border-0">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('create') }}">
                        <div class="mb-4">
                            <label for="name" class="form-label fs-5 fw-semibold">Community Name</label>
                            <input type="text" class="form-control form-control-lg" id="name" name="name" 
                            placeholder="Enter community name" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="category" class="form-label fs-5 fw-semibold">Category</label>
                            <select class="form-select form-select-lg" id="category" name="category" required>
                            <option value="">Choose category...</option>
                            {% for key, label in categories.items() %}
                                <option value="{{ label }}">{{ label }}</option>
                            {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label for="description" class="form-label fs-5 fw-semibold">Description</label>
                            <textarea class="form-control form-control-lg" id="description" name="description" rows="4" 
                            placeholder="Type your description" required></textarea>
                        </div>
                        
                 
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg py-3 fs-5">Create Community</button>
                            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-lg">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
