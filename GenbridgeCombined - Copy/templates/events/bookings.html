{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='event_common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='event.css') }}">
{% endblock %}
{% block content %}

<div class="genbridge-page-gray">
  <div class="container py-4">

    <div class="genbridge-panel">
      <div class="genbridge-panel-header">
        <h2 class="mb-1">My Booking</h2>
        <p class="text-muted mb-0">View and manage your registrations.</p>
      </div>

      <div class="genbridge-panel-body">

        <div class="genbridge-booking-list">
          {% for b in bookings %}
            <div class="genbridge-booking-card">

              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <h5 class="mb-1 fw-bold">{{ b.title }}</h5>
                  <div class="text-muted">📍 {{ b.location }}</div>
                  <div class="text-muted">Registered as: {{ b.full_name }} ({{ b.age_group }})</div>
                </div>

            <div class="genbridge-booking-actions">
  <!-- Edit icon -->
  <a href="{{ url_for('edit_booking', booking_id=b.booking_id) }}"
   onclick="return confirm('Edit this booking?');">
  ✏️
</a>

    
  

  <!-- Delete icon -->
  <form method="post"
      action="{{ url_for('delete_booking_route', booking_id=b.booking_id) }}"
      onsubmit="return confirm('Delete this booking?');"
      style="display:inline;">
  <button type="submit"
          class="genbridge-icon-btn danger"
          style="border:none; background:transparent; padding:0;">
    🗑️
  </button>
</form>

    
</div>

              </div>

            </div>
          {% endfor %}
        </div>
<form method="post"
      action="{{ url_for('clear_bookings') }}"
      class="mt-4"
      onsubmit="return confirm('Clear ALL bookings? This cannot be undone.');">
  <button type="submit" class="btn btn-outline-danger">Clear All</button>
</form>


      </div>
    </div>

  </div>
</div>

{% endblock %}
